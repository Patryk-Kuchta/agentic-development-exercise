name: CI

on:
  # Every branch, not just main: the exercises are done on branches, and the
  # gate is the only definition of done.
  push:
  pull_request:

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check
